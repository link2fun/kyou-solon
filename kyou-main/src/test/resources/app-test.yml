kyou:
    # 上传路径
    profile: /tmp/kyou-test-profile
    # redis 配置
    redis:
        config: |
            singleServerConfig:
              address: "redis://127.0.0.1:6679"
              database: 15

# 数据源, 指向 env/docker 里的开发库
datasource:
    default:
        type: com.zaxxer.hikari.HikariDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        jdbcUrl: jdbc:mysql://127.0.0.1:3606/kyou_solon?useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&rewriteBatchedStatements=true
        username: kyou
        password: kyou_pass

# 随机端口, 避免与本地 dev 实例的 8078 冲突
server:
    port: 0
