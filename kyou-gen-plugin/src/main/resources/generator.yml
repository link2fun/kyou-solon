# 代码生成
gen:
    # 作者
    author: link2fun
    # 默认生成包路径 system 需改成自己的模块名称 如 system monitor tool
    packageName: com.github.link2fun.模块名称.modular.功能名称
    # 自动去除表前缀，默认是false
    autoRemovePre: false
    # 表前缀（生成类名不会包含表前缀，多个用逗号分隔）
    tablePrefix: sys_

#    ---------------- 下面是扩展配置 ----------------
    # 是否启用 swagger , 启用 swagger 的话, 会加上 swagger 的一些注解
    swaggerEnable: true

    # restfulLevel = 0 只使用 GET 查询 POST 修改(含新增 编辑 删除)
    # restfulLevel = 2 使用 GET 查询 POST 新增 PUT 修改 DELETE 删除
    restfulLevel: 2
